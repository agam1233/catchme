<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch Me Game</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #runner {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #00ffcc;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            position: absolute;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: top 0.15s ease-out, left 0.15s ease-out;
        }
    </style>
</head>
<body>

    <button id="runner">Click Me!</button>

    <script>
        const button = document.getElementById('runner');

        // Center the button initially
        button.style.top = '50%';
        button.style.left = '50%';
        button.style.transform = 'translate(-50%, -50%)';

        button.addEventListener('mouseover', () => {
            // Remove the initial translation so absolute positioning works smoothly
            button.style.transform = 'none';
            
            // Calculate random coordinates within the window
            const maxX = window.innerWidth - button.offsetWidth;
            const maxY = window.innerHeight - button.offsetHeight;
            
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);

            // Move the button
            button.style.left = `${randomX}px`;
            button.style.top = `${randomY}px`;
        });

        button.addEventListener('click', () => {
            alert('You actually caught it? Nice.');
            button.innerText = "Caught!";
            button.style.backgroundColor = "#ff0055";
            button.style.boxShadow = "0 4px 15px rgba(255, 0, 85, 0.4)";
        });
    </script>
</body>
</html>
